schema_version: 1
project: .
exclude: [.git, .permsift, dist, reports]
scenarios:
  - id: test
    command: [npm, test]
    timeout_seconds: 30
    initial_write_grants: ['@workspace', '@cache']
    narrower_candidates:
      - from: '@workspace'
        to: ['@workspace/reports']
    assertions:
      - type: test_results
        path: '@workspace/reports/tests.json'
        expected_tests: [empty-cart, quantity, tax-rounding, reject-negative-price]
  - id: build
    command: [npm, run, build]
    timeout_seconds: 30
    initial_write_grants: ['@workspace', '@cache']
    narrower_candidates:
      - from: '@workspace'
        to: ['@workspace/dist']
    assertions:
      - type: file_contains
        path: '@workspace/dist/index.js'
        text: 'demo-version: 1.0.0'
      - type: json_equals
        path: '@workspace/dist/manifest.json'
        pointer: /smoke_test
        value: passed
