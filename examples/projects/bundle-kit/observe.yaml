schema_version: 1
project: .
scenarios:
  - id: build
    command: [node, scripts/build.mjs]
    initial_write_grants: ['@workspace/dist']
    auto_discover: false
    observation:
      esbuild:
        bundler: '@workspace/node_modules/esbuild'
        metafile: '@workspace/dist/meta.json'
        output_root: '@workspace/dist'
    assertions:
      - type: json_equals
        path: '@workspace/dist/build.json'
        pointer: /smoke_test
        value: passed
      - type: file_contains
        path: '@workspace/dist/index.mjs'
        text: 'total'
