name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sandbox: ${{ steps.classify.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: classify
        run: node scripts/ci-changes.mjs
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run offline:verify
      - run: npm run model:verify
      - run: npm run results:verify
      - run: npm run environment:verify -- --offline-only
      - run: npm run onboarding:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence-${{ matrix.node }}
          path: .permsift/
          include-hidden-files: true
  sandbox-core:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:integration:core
      - run: node dist/cli.js doctor --output .permsift/ci-doctor
      - run: npm run bundled:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-core-evidence
          path: .permsift/
          include-hidden-files: true
  sandbox-install:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration:install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-install-evidence
          path: .permsift/
          include-hidden-files: true
  # Keep the required-check name; explicitly distinguish docs from sandbox runs.
  sandbox:
    needs: [changes, sandbox-core, sandbox-install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both macOS integration partitions
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SANDBOX: ${{ needs.changes.outputs.sandbox }}
          CORE_RESULT: ${{ needs['sandbox-core'].result }}
          INSTALL_RESULT: ${{ needs['sandbox-install'].result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not complete: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$RUN_SANDBOX" == "false" && "$CORE_RESULT" == "skipped" && "$INSTALL_RESULT" == "skipped" ]]; then
            echo "Documentation-only change: real sandbox tests were not run."
          elif [[ "$RUN_SANDBOX" != "true" || "$CORE_RESULT" != "success" || "$INSTALL_RESULT" != "success" ]]; then
            echo "macOS verification incomplete: core=$CORE_RESULT install=$INSTALL_RESULT"
            exit 1
          fi
