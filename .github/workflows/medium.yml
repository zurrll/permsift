name: medium project profiling
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fast-glob:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run medium:prepare
      - run: npm run medium:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medium-project-evidence
          path: .permsift/
          include-hidden-files: true
